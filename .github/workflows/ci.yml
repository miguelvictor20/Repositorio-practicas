name: CI Workflow

on:
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Actualizar README con la feature
        run: |
          echo "Añadida feature: ${{ github.head_ref || github.ref_name }}" >> README.md
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git commit -am "chore: actualizar README con nueva feature" || echo "No changes to commit"
          git push

  validate-dev:
    runs-on: self-hosted
    needs: update-readme
    steps:
      - name: Validar DEV_TOKEN
        run: |
          if [ "${{ secrets.DEV_TOKEN }}" = "${{ vars.LOCAL_DEV_TOKEN }}" ]; then
            echo "Token de desarrollo válido."
          else
            echo "Error: El token no coincide."
            exit 1
          fi
